services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ascentintegrity
      POSTGRES_USER: ascent
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: [ascent_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascent -d ascentintegrity"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ascent_pgdata:
