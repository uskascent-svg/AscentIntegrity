name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: ascentintegrity, POSTGRES_USER: ascent, POSTGRES_PASSWORD: change-me}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ascent -d ascentintegrity"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e "backend[dev]"
      - run: cd backend && alembic upgrade head
        env: {DATABASE_URL: postgresql+psycopg://ascent:change-me@localhost:5432/ascentintegrity}
      - run: cd backend && pytest -q
        env: {DATABASE_URL: postgresql+psycopg://ascent:change-me@localhost:5432/ascentintegrity, SECRET_KEY: ci-only-secret-change-this-123456789}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: cd frontend && npm install && npm run build
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: cd contracts && npm install && npm test
