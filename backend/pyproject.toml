[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "ascentintegrity-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlalchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0", "alembic>=1.13,<2.0", "pydantic-settings>=2.4,<3.0", "python-multipart>=0.0.9", "python-jose[cryptography]>=3.3", "passlib[bcrypt]>=1.7.4", "bcrypt<4.1", "email-validator>=2.2"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
